
name: Build Minecraft Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Unzip and build
        run: |
          mkdir source
          unzip -q ./*.zip -d source
          cd source/SuperPowers-Forge-1.20.1
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod
          path: source/SuperPowers-Forge-1.20.1/build/libs/*.jar
